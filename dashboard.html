<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Lab Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0c0f14;--card:#171c25;--fg:#eef1f6;--mut:#8a94a6;--ok:#22c55e;--bad:#ef4444;--gr:#3a4252;--acc:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:24px}
.sub{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#fff;cursor:pointer;margin-left:6px}
button.g{background:var(--card);color:var(--fg)}
.card{background:var(--card);border-radius:16px;padding:20px}
#wait{text-align:center;padding:40px}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:16px 0}
#url{font-size:20px;font-weight:700;color:var(--acc);word-break:break-all}
#main{display:none}
.top{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-bottom:16px}
.donut{width:180px;height:180px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.donut div{width:130px;height:130px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut b{font-size:34px}.donut span{color:var(--mut);font-size:13px}
.leg{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.verdict{font-size:22px;font-weight:700;margin-bottom:8px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--gr);margin:14px 0}
.bar i{display:block}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.t{background:var(--card);border-radius:14px;padding:16px;border-left:5px solid var(--gr)}
.t.p{border-color:var(--ok)}.t.f{border-color:var(--bad)}
.t b{display:block;margin-bottom:6px}
.st{font-size:13px;font-weight:700}
.p .st{color:var(--ok)}.f .st{color:var(--bad)}.n .st{color:var(--mut)}
.imei{font-family:monospace;font-size:18px}
@media(max-width:800px){.top{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}.card,.t{background:#fff;border:1px solid #ccc}button,#wait{display:none!important}.donut div{background:#fff}}
</style></head>
<body>
<header>
 <div><h1>Phone Lab Dashboard</h1><div class="sub" id="meta">Waiting for a phone</div></div>
 <div><button class="g" onclick="window.print()">Print / Save PDF</button><button onclick="newPhone()">Test new phone</button></div>
</header>

<div id="wait" class="card">
 <div>On the phone, scan this code or open:</div>
 <div id="qr"></div>
 <div id="url"></div>
 <p class="sub">Results will appear here live as you test.</p>
</div>

<div id="main">
 <div class="top">
  <div class="card">
   <div class="donut" id="donut"><div><b id="pct">0%</b><span id="cnt"></span></div></div>
   <div class="leg"><span><i class="dot" style="background:var(--ok)"></i>Pass</span><span><i class="dot" style="background:var(--bad)"></i>Fail</span><span><i class="dot" style="background:var(--gr)"></i>Pending</span></div>
  </div>
  <div class="card">
   <div class="verdict" id="verdict"></div>
   <div class="bar" id="bar"></div>
   <div class="kv" id="dev"></div>
  </div>
 </div>
 <div class="grid" id="grid"></div>
 <div class="card"><b>IMEI</b><div class="kv" id="imei" style="margin-top:10px"></div></div>
</div>

<script>
var code=localStorage.getItem('pl_code');
if(!code){code=Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem('pl_code',code)}
var link=location.origin+'/p/'+code;
document.getElementById('url').textContent=link;
new QRCode(document.getElementById('qr'),{text:link,width:200,height:200});
function newPhone(){localStorage.removeItem('pl_code');location.reload()}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

function render(d){
  document.getElementById('wait').style.display='none';
  document.getElementById('main').style.display='block';
  var T=d.tests||[],pass=0,fail=0,names=[];
  T.forEach(function(t){if(t.result===true)pass++;else if(t.result===false){fail++;names.push(t.name)}});
  var tot=T.length,pend=tot-pass-fail,pp=pass/tot*100,fp=fail/tot*100;
  document.getElementById('donut').style.background='conic-gradient(var(--ok) 0 '+pp+'%,var(--bad) '+pp+'% '+(pp+fp)+'%,var(--gr) '+(pp+fp)+'% 100%)';
  document.getElementById('pct').textContent=Math.round(pp)+'%';
  document.getElementById('cnt').textContent=pass+' of '+tot+' passed';
  var v=document.getElementById('verdict');
  if(fail>0){v.style.color='var(--bad)';v.textContent=fail+' issue'+(fail>1?'s':'')+': '+names.join(', ')}
  else if(pend===0){v.style.color='var(--ok)';v.textContent='All tests passed'}
  else{v.style.color='var(--fg)';v.textContent='Testing in progress, '+pend+' left'}
  document.getElementById('bar').innerHTML='<i style="width:'+pp+'%;background:var(--ok)"></i><i style="width:'+fp+'%;background:var(--bad)"></i>';
  var dv=d.device||{};
  document.getElementById('dev').innerHTML=
   '<span>Screen</span><span>'+esc(dv.screen)+'</span><span>Battery</span><span>'+esc(dv.battery||'n/a')+'</span>'+
   '<span>CPU cores</span><span>'+esc(dv.cores||'n/a')+'</span><span>RAM (approx)</span><span>'+esc(dv.mem?dv.mem+' GB':'n/a')+'</span>'+
   '<span>Platform</span><span>'+esc(dv.platform)+'</span><span>Browser</span><span style="font-size:12px">'+esc(dv.ua)+'</span>';
  document.getElementById('grid').innerHTML=T.map(function(t){
    var c=t.result===true?'p':t.result===false?'f':'n',l=t.result===true?'PASS':t.result===false?'FAIL':'NOT TESTED';
    return '<div class="t '+c+'"><b>'+esc(t.name)+'</b><div class="st">'+l+'</div></div>';
  }).join('');
  var im=d.imei||{};
  document.getElementById('imei').innerHTML=
   '<span>IMEI 1</span><span class="imei">'+esc(im.a||'-')+' <small>('+esc(im.sa)+')</small></span>'+
   '<span>IMEI 2</span><span class="imei">'+esc(im.b||'-')+' <small>('+esc(im.sb)+')</small></span>';
  document.getElementById('meta').textContent='Session '+code+' | updated '+new Date(d.at).toLocaleTimeString();
}
var es=new EventSource('/events/'+code);
es.onmessage=function(e){render(JSON.parse(e.data))};
</script>
</body></html>
